<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 400" width="100%" height="100%" fill="none">
  <defs>
    <!-- Gold Metallic Gradients -->
    <linearGradient id="goldTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF3B0" />
      <stop offset="25%" stop-color="#FFD700" />
      <stop offset="50%" stop-color="#E5A800" />
      <stop offset="75%" stop-color="#FFAE00" />
      <stop offset="100%" stop-color="#996000" />
    </linearGradient>

    <linearGradient id="goldBevel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF9D2" />
      <stop offset="30%" stop-color="#FFDE59" />
      <stop offset="60%" stop-color="#C58500" />
      <stop offset="85%" stop-color="#FFE072" />
      <stop offset="100%" stop-color="#734200" />
    </linearGradient>

    <linearGradient id="goldFrame" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFD54F" />
      <stop offset="25%" stop-color="#FFE082" />
      <stop offset="50%" stop-color="#B7791F" />
      <stop offset="75%" stop-color="#FFF8E1" />
      <stop offset="100%" stop-color="#8D5B00" />
    </linearGradient>

    <linearGradient id="goldFrameSide" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFDE7" />
      <stop offset="30%" stop-color="#F59E0B" />
      <stop offset="70%" stop-color="#B45309" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>

    <linearGradient id="glassReflection" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35" />
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.08" />
      <stop offset="60%" stop-color="#60A5FA" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="flareGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFD54F" stop-opacity="0" />
      <stop offset="30%" stop-color="#FFB300" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="70%" stop-color="#FFB300" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#FFD54F" stop-opacity="0" />
    </linearGradient>

    <radialGradient id="sunburst" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="35%" stop-color="#F59E0B" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#D97706" stop-opacity="0" />
    </radialGradient>

    <!-- Filters for Depth and Shine -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.5" />
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#F59E0B" flood-opacity="0.3" />
    </filter>

    <filter id="frameShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- ==================== LEFT ICON: 3 TRIPLE GOLDEN GLASS FRAMES ==================== -->
  <g id="glassFrames" filter="url(#frameShadow)" transform="translate(15, 0)">
    <!-- BACK / THIRD FRAME (LEFTMOST) -->
    <g id="frame3">
      <!-- Frame Border Outer -->
      <polygon points="45,90 90,65 90,300 45,280" fill="url(#goldFrameSide)" stroke="url(#goldBevel)" stroke-width="3" />
      <!-- Glass Pane -->
      <polygon points="52,98 83,78 83,288 52,272" fill="url(#glassReflection)" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1" />
    </g>

    <!-- MIDDLE / SECOND FRAME -->
    <g id="frame2">
      <!-- Frame Border Outer -->
      <polygon points="95,70 145,45 145,325 95,300" fill="url(#goldFrameSide)" stroke="url(#goldBevel)" stroke-width="4" />
      <!-- Glass Pane -->
      <polygon points="103,79 137,58 137,312 103,291" fill="url(#glassReflection)" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="1.5" />
      <!-- Diagonal Shine on glass -->
      <line x1="105" y1="200" x2="135" y2="100" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.5" />
    </g>

    <!-- FRONT / FIRST MAIN FRAME (OPENING PERSPECTIVE) -->
    <g id="frame1">
      <!-- Outer Perspective Poly -->
      <path d="M150,40 L345,115 L345,148 L170,85 L170,335 L345,285 L345,318 L150,370 Z" fill="url(#goldBevel)" stroke="#78350F" stroke-width="2" />
      <!-- Inner Frame Golden Lip -->
      <path d="M165,58 L328,122 L328,135 L178,82 L178,328 L328,285 L328,298 L165,348 Z" fill="url(#goldTop)" />
      <!-- Big Front Crystal Glass Pane -->
      <polygon points="175,80 340,140 340,290 175,330" fill="url(#glassReflection)" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="1.5" />
      <!-- Glass Dynamic Light Streak -->
      <polygon points="180,180 280,105 295,110 185,210" fill="#FFFFFF" fill-opacity="0.25" />
      <polygon points="185,290 320,160 325,170 190,310" fill="#FFFFFF" fill-opacity="0.18" />
      <!-- Corner Sparkle Flare -->
      <circle cx="170" cy="190" r="14" fill="url(#sunburst)" />
    </g>
  </g>

  <!-- ==================== RIGHT LOGO TYPOGRAPHY: SMART VIDROS ==================== -->
  <g id="brandText" filter="url(#goldGlow)" transform="translate(365, 0)">
    
    <!-- 3D SHADOW / EXTRUSION BEHIND 'SMART' -->
    <text x="0" y="218" font-family="'Montserrat', 'Arial Black', 'Impact', sans-serif" font-weight="900" font-size="142" letter-spacing="4" fill="#3D1D00">
      SMART
    </text>
    <text x="2" y="216" font-family="'Montserrat', 'Arial Black', 'Impact', sans-serif" font-weight="900" font-size="142" letter-spacing="4" fill="#6B3900">
      SMART
    </text>
    <text x="4" y="214" font-family="'Montserrat', 'Arial Black', 'Impact', sans-serif" font-weight="900" font-size="142" letter-spacing="4" fill="#A15C00">
      SMART
    </text>

    <!-- MAIN 3D METALLIC 'SMART' -->
    <text x="0" y="210" font-family="'Montserrat', 'Arial Black', 'Impact', sans-serif" font-weight="900" font-size="142" letter-spacing="4" fill="url(#goldTop)" stroke="url(#goldBevel)" stroke-width="3.5" stroke-linejoin="round">
      SMART
    </text>

    <!-- INNER SHINE HIGHLIGHT ON 'SMART' -->
    <text x="0" y="210" font-family="'Montserrat', 'Arial Black', 'Impact', sans-serif" font-weight="900" font-size="142" letter-spacing="4" fill="none" stroke="#FFFDE7" stroke-width="1.2" stroke-opacity="0.7">
      SMART
    </text>

    <!-- ==================== GOLDEN LIGHT BEAM DIVIDER ==================== -->
    <g transform="translate(0, 232)">
      <!-- Base Line -->
      <rect x="0" y="0" width="560" height="4" rx="2" fill="url(#flareGradient)" />
      <!-- Center Glow Burst -->
      <ellipse cx="280" cy="2" rx="60" ry="8" fill="url(#sunburst)" />
      <circle cx="280" cy="2" r="3.5" fill="#FFFFFF" />
    </g>

    <!-- ==================== 'VIDROS' METALLIC LUXURY LETTERING ==================== -->
    <!-- 3D Shadow for VIDROS -->
    <text x="18" y="324" font-family="'Montserrat', 'Arial', sans-serif" font-weight="800" font-size="68" letter-spacing="44" fill="#422006">
      VIDROS
    </text>
    <text x="16" y="322" font-family="'Montserrat', 'Arial', sans-serif" font-weight="800" font-size="68" letter-spacing="44" fill="#854D0E">
      VIDROS
    </text>
    <!-- Main VIDROS -->
    <text x="15" y="320" font-family="'Montserrat', 'Arial', sans-serif" font-weight="800" font-size="68" letter-spacing="44" fill="url(#goldTop)" stroke="url(#goldBevel)" stroke-width="2" stroke-linejoin="round">
      VIDROS
    </text>
    <!-- Top Highlights -->
    <text x="15" y="320" font-family="'Montserrat', 'Arial', sans-serif" font-weight="800" font-size="68" letter-spacing="44" fill="none" stroke="#FFF9D2" stroke-width="0.8" stroke-opacity="0.8">
      VIDROS
    </text>
  </g>
</svg>
