<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 370" width="100%" height="100%" fill="none">
  <defs>
    <!-- Gold Metallic Gradients -->
    <linearGradient id="goldTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF8D6" />
      <stop offset="20%" stop-color="#FFD700" />
      <stop offset="45%" stop-color="#F59E0B" />
      <stop offset="70%" stop-color="#FFAE00" />
      <stop offset="100%" stop-color="#8C5300" />
    </linearGradient>

    <linearGradient id="goldBevel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDE7" />
      <stop offset="30%" stop-color="#FFDE59" />
      <stop offset="60%" stop-color="#C58500" />
      <stop offset="85%" stop-color="#FFE072" />
      <stop offset="100%" stop-color="#663800" />
    </linearGradient>

    <linearGradient id="goldFrameSide" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFDE7" />
      <stop offset="30%" stop-color="#F59E0B" />
      <stop offset="70%" stop-color="#B45309" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>

    <linearGradient id="glassReflection" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.45" />
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.10" />
      <stop offset="60%" stop-color="#93C5FD" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.30" />
    </linearGradient>

    <linearGradient id="flareGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFD54F" stop-opacity="0" />
      <stop offset="25%" stop-color="#FFB300" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="75%" stop-color="#FFB300" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#FFD54F" stop-opacity="0" />
    </linearGradient>

    <radialGradient id="sunburst" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="40%" stop-color="#F59E0B" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#B45309" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- ==================== LEFT ICON: 3 TRIPLE GOLDEN GLASS FRAMES ==================== -->
  <g id="glassFrames">
    <!-- BACK / THIRD FRAME (LEFTMOST) -->
    <g id="frame3">
      <polygon points="35,80 80,55 80,290 35,270" fill="url(#goldFrameSide)" stroke="url(#goldBevel)" stroke-width="2.5" />
      <polygon points="42,88 73,68 73,278 42,262" fill="url(#glassReflection)" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1" />
    </g>

    <!-- MIDDLE / SECOND FRAME -->
    <g id="frame2">
      <polygon points="85,60 135,35 135,315 85,290" fill="url(#goldFrameSide)" stroke="url(#goldBevel)" stroke-width="3" />
      <polygon points="93,69 127,48 127,302 93,281" fill="url(#glassReflection)" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="1.5" />
      <line x1="95" y1="190" x2="125" y2="90" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.5" />
    </g>

    <!-- FRONT / FIRST MAIN FRAME (OPENING PERSPECTIVE) -->
    <g id="frame1">
      <path d="M140,30 L335,105 L335,138 L160,75 L160,325 L335,275 L335,308 L140,360 Z" fill="url(#goldBevel)" stroke="#5B2900" stroke-width="2" />
      <path d="M155,48 L318,112 L318,125 L168,72 L168,318 L318,275 L318,288 L155,338 Z" fill="url(#goldTop)" />
      <polygon points="165,70 330,130 330,280 165,320" fill="url(#glassReflection)" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="1.5" />
      <!-- Glass Dynamic Light Streaks -->
      <polygon points="170,170 270,95 285,100 175,200" fill="#FFFFFF" fill-opacity="0.3" />
      <polygon points="175,280 310,150 315,160 180,300" fill="#FFFFFF" fill-opacity="0.2" />
      <!-- Corner Sparkle Flare -->
      <circle cx="160" cy="180" r="14" fill="url(#sunburst)" />
    </g>
  </g>

  <!-- ==================== RIGHT BRAND: SMART (100% PURE VECTOR PATHS) ==================== -->
  <g id="brandSmart">
    <!-- 3D Extrusion Shadows (Dark Gold) -->
    <g fill="#451A03" transform="translate(3, 4)">
      <!-- S -->
      <path d="M 455,75 L 455,100 L 400,100 C 385,100 380,108 380,118 C 380,128 388,134 408,138 L 432,143 C 458,148 472,162 472,185 C 472,212 450,225 418,225 L 355,225 L 355,200 L 418,200 C 435,200 444,194 444,184 C 444,174 434,168 416,164 L 392,159 C 365,154 352,140 352,118 C 352,90 375,75 410,75 Z" />
      <!-- M -->
      <path d="M 485,75 L 512,75 L 545,155 L 578,75 L 605,75 L 605,225 L 580,225 L 580,125 L 555,188 L 535,188 L 510,125 L 510,225 L 485,225 Z" />
      <!-- A -->
      <path d="M 660,75 L 685,75 L 725,225 L 697,225 L 688,190 L 655,190 L 647,225 L 618,225 Z M 662,165 L 682,165 L 672,115 Z" />
      <!-- R -->
      <path d="M 735,75 L 795,75 C 818,75 830,88 830,110 C 830,126 820,138 805,145 L 832,225 L 802,225 L 778,152 L 762,152 L 762,225 L 735,225 Z M 762,130 L 792,130 C 802,130 808,124 808,112 C 808,100 802,96 792,96 L 762,96 Z" />
      <!-- T -->
      <path d="M 835,75 L 925,75 L 925,100 L 894,100 L 894,225 L 866,225 L 866,100 L 835,100 Z" />
    </g>

    <!-- Main Metallic Gold Letters -->
    <g fill="url(#goldTop)" stroke="url(#goldBevel)" stroke-width="2" stroke-linejoin="round">
      <!-- S -->
      <path d="M 455,75 L 455,100 L 400,100 C 385,100 380,108 380,118 C 380,128 388,134 408,138 L 432,143 C 458,148 472,162 472,185 C 472,212 450,225 418,225 L 355,225 L 355,200 L 418,200 C 435,200 444,194 444,184 C 444,174 434,168 416,164 L 392,159 C 365,154 352,140 352,118 C 352,90 375,75 410,75 Z" />
      <!-- M -->
      <path d="M 485,75 L 512,75 L 545,155 L 578,75 L 605,75 L 605,225 L 580,225 L 580,125 L 555,188 L 535,188 L 510,125 L 510,225 L 485,225 Z" />
      <!-- A -->
      <path d="M 660,75 L 685,75 L 725,225 L 697,225 L 688,190 L 655,190 L 647,225 L 618,225 Z M 662,165 L 682,165 L 672,115 Z" />
      <!-- R -->
      <path d="M 735,75 L 795,75 C 818,75 830,88 830,110 C 830,126 820,138 805,145 L 832,225 L 802,225 L 778,152 L 762,152 L 762,225 L 735,225 Z M 762,130 L 792,130 C 802,130 808,124 808,112 C 808,100 802,96 792,96 L 762,96 Z" />
      <!-- T -->
      <path d="M 835,75 L 925,75 L 925,100 L 894,100 L 894,225 L 866,225 L 866,100 L 835,100 Z" />
    </g>

    <!-- High-Glint Specular Highlights -->
    <g fill="none" stroke="#FFFDE7" stroke-width="1.2" stroke-opacity="0.8">
      <path d="M 410,76 L 454,76" />
      <path d="M 486,76 L 511,76" />
      <path d="M 661,76 L 684,76" />
      <path d="M 736,76 L 794,76" />
      <path d="M 836,76 L 924,76" />
    </g>
  </g>

  <!-- ==================== GOLDEN DIVIDER LINE ==================== -->
  <g id="dividerLine" transform="translate(0, 5)">
    <rect x="355" y="240" width="570" height="4.5" rx="2.2" fill="url(#flareGradient)" />
    <ellipse cx="640" cy="242" rx="70" ry="8" fill="url(#sunburst)" />
    <circle cx="640" cy="242" r="4" fill="#FFFFFF" />
  </g>

  <!-- ==================== RIGHT BRAND: VIDROS (100% PURE VECTOR PATHS) ==================== -->
  <g id="brandVidros" transform="translate(0, 10)">
    <!-- 3D Extrusion Shadows -->
    <g fill="#451A03" transform="translate(2, 2.5)">
      <!-- V -->
      <path d="M 370,260 L 388,260 L 402,305 L 416,260 L 434,260 L 412,325 L 392,325 Z" />
      <!-- I -->
      <path d="M 470,260 L 485,260 L 485,325 L 470,325 Z" />
      <!-- D -->
      <path d="M 525,260 L 565,260 C 585,260 598,272 598,292 C 598,313 585,325 565,325 L 525,325 Z M 541,274 L 541,311 L 562,311 C 574,311 581,304 581,292 C 581,280 574,274 562,274 Z" />
      <!-- R -->
      <path d="M 635,260 L 675,260 C 690,260 700,270 700,283 C 700,294 693,302 682,305 L 702,325 L 682,325 L 665,307 L 651,307 L 651,325 L 635,325 Z M 651,273 L 671,273 C 678,273 684,277 684,285 C 684,293 678,296 671,296 L 651,296 Z" />
      <!-- O -->
      <path d="M 777,260 C 800,260 815,274 815,292 C 815,311 800,325 777,325 C 755,325 740,311 740,292 C 740,274 755,260 777,260 Z M 777,274 C 765,274 756,282 756,292 C 756,303 765,311 777,311 C 789,311 799,303 799,292 C 799,282 789,274 777,274 Z" />
      <!-- S -->
      <path d="M 915,260 L 915,274 L 885,274 C 876,274 872,278 872,283 C 872,288 877,291 888,293 L 898,295 C 912,298 920,305 920,315 C 920,327 908,333 890,333 L 858,333 L 858,319 L 890,319 C 899,319 904,316 904,311 C 904,306 898,303 888,301 L 878,299 C 864,296 856,289 856,279 C 856,266 869,260 888,260 Z" />
    </g>

    <!-- Main Metallic VIDROS -->
    <g fill="url(#goldTop)" stroke="url(#goldBevel)" stroke-width="1.2" stroke-linejoin="round">
      <!-- V -->
      <path d="M 370,260 L 388,260 L 402,305 L 416,260 L 434,260 L 412,325 L 392,325 Z" />
      <!-- I -->
      <path d="M 470,260 L 485,260 L 485,325 L 470,325 Z" />
      <!-- D -->
      <path d="M 525,260 L 565,260 C 585,260 598,272 598,292 C 598,313 585,325 565,325 L 525,325 Z M 541,274 L 541,311 L 562,311 C 574,311 581,304 581,292 C 581,280 574,274 562,274 Z" />
      <!-- R -->
      <path d="M 635,260 L 675,260 C 690,260 700,270 700,283 C 700,294 693,302 682,305 L 702,325 L 682,325 L 665,307 L 651,307 L 651,325 L 635,325 Z M 651,273 L 671,273 C 678,273 684,277 684,285 C 684,293 678,296 671,296 L 651,296 Z" />
      <!-- O -->
      <path d="M 777,260 C 800,260 815,274 815,292 C 815,311 800,325 777,325 C 755,325 740,311 740,292 C 740,274 755,260 777,260 Z M 777,274 C 765,274 756,282 756,292 C 756,303 765,311 777,311 C 789,311 799,303 799,292 C 799,282 789,274 777,274 Z" />
      <!-- S -->
      <path d="M 915,260 L 915,274 L 885,274 C 876,274 872,278 872,283 C 872,288 877,291 888,293 L 898,295 C 912,298 920,305 920,315 C 920,327 908,333 890,333 L 858,333 L 858,319 L 890,319 C 899,319 904,316 904,311 C 904,306 898,303 888,301 L 878,299 C 864,296 856,289 856,279 C 856,266 869,260 888,260 Z" />
    </g>
  </g>
</svg>
